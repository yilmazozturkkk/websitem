name: Uçuş Verisi Gönder

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'  # Her 30 dakikada bir

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'yu klonla
        uses: actions/checkout@v3

      - name: Node.js 20 kur
        uses: actions/setup-node@v3
        with:
          node-version: '20'  # Kesin sürüm belirtmek için '20.18.1' de kullanabilirsiniz
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Bağımlılıkları kur
        run: |
          npm ci --no-audit
          npm remove undici --save  # Undici'yi kaldır

      - name: Veriyi çek ve gönder
        run: node sendData.js
